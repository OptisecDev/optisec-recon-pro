<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} — {{ app_name }}</title>
  <link rel="stylesheet" href="{{ static_v('css/style.css') }}">
  <link rel="stylesheet" href="{{ static_v('css/inline-extracted.css') }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <style nonce="{{ request.state.csp_nonce }}">
    body { background: var(--bg); color: var(--text); }
    .legal-wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 60px; line-height: 1.65; }
    .legal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .legal-top .logo { font-size: 20px; font-weight: 800; color: var(--accent); text-decoration: none; }
    .legal-top nav a { color: var(--text-dim); font-size: 13px; margin-left: 16px; }
    .legal-wrap h1 { font-size: 30px; color: var(--accent); margin-bottom: 4px; }
    .legal-wrap .updated { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
    .legal-wrap h2 { font-size: 19px; margin: 32px 0 10px; padding-top: 12px; border-top: 1px solid var(--border); }
    .legal-wrap h3 { font-size: 15px; margin: 18px 0 6px; }
    .legal-wrap p, .legal-wrap li { font-size: 14px; color: var(--text); }
    .legal-wrap p { margin-bottom: 10px; }
    .legal-wrap ul { margin: 0 0 12px 22px; }
    .legal-wrap li { margin-bottom: 5px; }
    .legal-wrap code { background: var(--card2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    .legal-wrap table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 13px; }
    .legal-wrap th, .legal-wrap td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; vertical-align: top; }
    .legal-wrap th { background: var(--card); }
    .legal-draft { border: 1px solid var(--warning, #f0ad4e); background: var(--card); color: var(--warning, #f0ad4e); padding: 10px 14px; border-radius: 6px; font-size: 14px; font-weight: 700; margin-bottom: 24px; text-align: center; }
    .legal-footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--text-dim); font-size: 13px; text-align: center; }
    .legal-footer a { color: var(--text-dim); margin: 0 8px; }
    .legal-footer a:hover { color: var(--accent); }
    @media (max-width: 600px) { .legal-top { flex-direction: column; gap: 10px; } .legal-top nav a { margin: 0 8px; } }
  </style>
</head>
<body>
<div class="legal-wrap">
  <div class="legal-top">
    <a href="/landing" class="logo">🛡️ OPTISEC</a>
    <nav>
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
      <a href="/login">Sign in</a>
    </nav>
  </div>

  <div class="legal-draft" role="note"><span dir="rtl" lang="ar">مسودة بانتظار المراجعة القانونية</span> — Draft pending legal review</div>

  {% block content %}{% endblock %}

  <div class="legal-footer">
    <a href="/landing">Home</a>
    <a href="/privacy">Privacy Policy</a>
    <a href="/terms">Terms of Service</a>
    <a href="mailto:{{ contact_email }}">Contact</a>
    <div>© 2026 OPTISEC Recon Pro</div>
  </div>
</div>
</body>
</html>
