name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI-only placeholder values -- none of these are real secrets.
      OPTISEC_LICENSE_SECRET: ci-only-not-a-secret
      GROQ_ENV: test
      AUDIT_LOG_ADMIN_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches Dockerfile's python:3.12-slim
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Set CI-only Fernet key
        # app/core/config.py requires a syntactically valid Fernet key.
        # base64url of a fixed, public placeholder string -- computed here
        # rather than written as a literal so secret scanners don't flag it.
        run: |
          python -c "import base64; print('FIELD_ENCRYPTION_KEY=' + base64.urlsafe_b64encode(b'ci-only-not-a-secret-fernet-key!').decode())" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -q -rs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: bandit
        # Blocking on High severity only (-lll). Next step: move to -ll once
        # the Medium-severity findings have been triaged.
        run: bandit -r web modules -lll
      - name: pip-audit
        if: ${{ !cancelled() }}   # still run if bandit reported findings
        # Ignored advisories have no fixed release AND don't apply here:
        # - CVE-2024-23342 (ecdsa, via python-jose): Minerva timing attack on
        #   ECDSA signing. Our JWTs are HS256 only (web/auth.py ALGORITHM) --
        #   no ECDSA key is ever used to sign or verify anything.
        # - CVE-2023-36464 (PyPDF2, via maigret): infinite loop when parsing a
        #   crafted PDF. Nothing in our code imports PyPDF2 or reads PDFs with
        #   it (reports are generated with reportlab). PyPDF2 3.0.1 is its final
        #   release; the fix only exists in the renamed `pypdf` package.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln CVE-2024-23342
          --ignore-vuln CVE-2023-36464
      - name: pip-audit (tools)
        # Separate step: theHarvester's own isolated venv (requirements-tools.txt)
        # is resolved independently of the app's requirements.txt.
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements-tools.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # auto-provided by Actions, not a stored secret
          GITLEAKS_ENABLE_COMMENTS: false            # PR comments would need pull-requests: write
